syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.Pinnacle.Protos";

package gameinterfacepinnacle;

// The greeting service definition.
service GameInterfacePinnacle {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecord (GameRecordRequest) returns (GameRecordReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	string player_code = 5;
}

message PlayerBalanceRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	string player_code = 5;
}

message PlayerLogoutRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	string player_code = 5;
}

message FundRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	string player_code = 5;
	string transaction_id = 6;
	phoenix.protobuf.DecimalValue amount = 7;
}

message FundStatusRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	string transaction_id = 5;
}

message GameUrlRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	string player_code = 5;
	string locale = 6;
}

message GameRecordRequest {
	string api_url = 1;
    string agent_code = 2;
    string agent_key = 3;
    string secret_key = 4;
	google.protobuf.Timestamp start_time = 5;
	google.protobuf.Timestamp end_time = 6;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string res = 1;
}

message GameUrlReply{
	string game_url = 1;
}

message GameRecordReply {
	repeated GameRecordInfo items = 1;
}

message GameRecordInfo {
	string external_round_id = 1;
	string external_game = 2;
	string external_game_id = 3;
    string player_code = 4;
	bool is_closed = 5;
	bool is_void = 6;
	google.protobuf.Timestamp external_created_on = 7;
	google.protobuf.Timestamp external_closed_on = 8;
	phoenix.protobuf.DecimalValue bet = 9;
	phoenix.protobuf.DecimalValue turnover = 10;
	phoenix.protobuf.DecimalValue settle = 11;
	phoenix.protobuf.DecimalValue win_loss = 12;
	string additional_data = 13;
}

message CheckingServiceReply{
    string machine_name = 1;
}